<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garda CAD</title>
<link rel="icon" href="logo.png?v=2">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <form class="logon" id="loginForm" autocomplete="off">
    <div class="logon-head">
      <img src="logo.png?v=2" alt="">
      <div><div class="org">An Garda Síochána</div><div class="sys">Computer Aided Dispatch</div></div>
    </div>
    <div class="logon-body">
      <label for="lu">User ID</label>
      <input id="lu" placeholder="GARDA-0000" required>
      <label for="lp">Password</label>
      <input id="lp" type="password" required>
      <div class="logon-err" id="loginErr"></div>
      <button class="btn wide" type="submit">Log in</button>
    </div>
    <div class="logon-notice">Authorised users only. Every search on this system is recorded against your User ID.</div>
  </form>
  <div class="login-foot" id="loginClock"></div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="title">Computer Aided Dispatch<small id="pageName"></small></div>
    <div class="officer" id="officer"></div>
  </div>
  <img class="logo" src="logo.png?v=2" alt="Logo">
  <nav class="sidebar">
    <button class="nav" data-page="dashboard">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2"><rect x="5" y="5" width="16" height="22" rx="5"/><rect x="27" y="5" width="16" height="13" rx="5"/><rect x="5" y="32" width="16" height="11" rx="5"/><rect x="27" y="24" width="16" height="19" rx="5"/></svg>
      <span>DASHBOARD</span></button>
    <button class="nav" data-page="vehicles">
      <svg viewBox="0 0 48 48" fill="currentColor"><path d="M10 20l4-10c.6-1.5 2-2.5 3.6-2.5h12.8c1.6 0 3 1 3.6 2.5l4 10h1.5c1.4 0 2.5 1.1 2.5 2.5V34c0 1.1-.9 2-2 2h-2v4c0 1.1-.9 2-2 2h-3c-1.1 0-2-.9-2-2v-4H17v4c0 1.1-.9 2-2 2h-3c-1.1 0-2-.9-2-2v-4H8c-1.1 0-2-.9-2-2V22.5C6 21.1 7.1 20 8.5 20H10zm4.3-.5h19.4l-3-7.5H17.3l-3 7.5zM12 31a3 3 0 100-6 3 3 0 000 6zm24 0a3 3 0 100-6 3 3 0 000 6z"/></svg>
      <span>Vehicles</span></button>
    <button class="nav" data-page="reports">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M10 4h20l9 9v31H10z"/><path d="M30 4v9h9"/><path d="M16 20h16M16 26h16M16 32h16M16 38h10"/></svg>
      <span>Reports</span></button>
    <button class="nav" data-page="control">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="15" r="3" fill="currentColor"/><path d="M17 9a9 9 0 000 12M31 9a9 9 0 010 12M12 5a15 15 0 000 20M36 5a15 15 0 010 20"/><path d="M24 18l-8 26M24 18l8 26M19 34h10M18 39h12M21 28h6"/></svg>
      <span>Control</span></button>
    <button class="nav" data-page="settings">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3"><circle cx="24" cy="24" r="7"/><path d="M24 4l4 5 6-2 1 6 6 2-2 6 5 3-5 3 2 6-6 2-1 6-6-2-4 5-4-5-6 2-1-6-6-2 2-6-5-3 5-3-2-6 6-2 1-6 6 2z" stroke-linejoin="round"/></svg>
      <span>Settings</span></button>
  </nav>
  <main class="content" id="content"></main>
  <div class="statusbar"><span id="sbUser"></span><span id="sbCount"></span><span id="sbClock"></span></div>
</div>

<script src="app.js"></script>
<script src="reports.js"></script>
<script src="control.js"></script>
</body>
</html>
